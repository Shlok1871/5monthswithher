<!DOCTYPE html>

  <title>Us Being Us 🎀</title>

  <style>
    body {

      background: linear-gradient(135deg, #fff1f5, #fff8fb);
      text-align: center;
      padding: 30px;
      margin: 0;
    }

    h1 {
      color: #d63384;
      font-size: 42px;
      text-shadow: 1px 1px 8px rgba(214,51,132,0.2);
      margin-bottom: 35px;
    }

    .video-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 35px;
    }

    video {
      width: 90%;
      max-width: 750px;
      border-radius: 20px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.22);
      transition: all 0.3s ease;
      background: white;
    }

    video:hover {
      transform: scale(1.01);
      box-shadow: 0 12px 26px rgba(0,0,0,0.28);
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 32px;
      }

      video {
        width: 100%;
      }
    }
  </style>
</head>
